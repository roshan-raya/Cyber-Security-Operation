# Continuous integration for this repo’s patch-management demo stack.
#
# Rough narrative of the job below: install linters → build compose sim images → bring the stack up
# → ansible-lint + syntax-check → run the same `make patch` path developers use → assert reports/metrics.
# If this workflow is red, compare with local `make up-sim` + `make patch` + `make validate-reports`.
name: CI - Patch Management

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  patch-ci:
    name: Patch Management Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ansible-lint
          sudo apt-get update
          sudo apt-get install -y make jq

      - name: Ansible lint check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_ROLES_PATH: ansible/roles
          ANSIBLE_LOG_PATH: /tmp/patch.log
        run: ansible-lint ansible/

      - name: Build sim profile Docker images
        run: docker compose --profile sim build --no-cache

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose --profile sim up -d
          sleep 45

      - name: Ansible syntax check
        run: |
          docker compose exec -T ansible sh -lc \
            "ansible-playbook -i inventory/hosts.ini playbooks/patch_orchestrator.yml --syntax-check"
          docker compose exec -T ansible sh -lc \
            "ansible-playbook -i inventory/hosts.ini playbooks/rollback.yml --syntax-check"

      - name: Run patch orchestration
        id: patch_run
        run: make patch

      - name: Validate report gates
        run: |
          docker compose exec -T ansible sh -lc '
            test -f /ansible/reports/patch_report_latest.json
            COMPLIANCE=$(jq -r ".compliance_percentage" /ansible/reports/patch_report_latest.json)
            DURATION=$(jq -r ".duration_seconds" /ansible/reports/patch_report_latest.json)
            FAILED=$(jq "[.hosts[] | select(.failed == true)] | length" /ansible/reports/patch_report_latest.json)
            echo "Compliance: ${COMPLIANCE}%"
            echo "Duration: ${DURATION}s"
            echo "Failed hosts: ${FAILED}"
            awk "BEGIN {exit !(${COMPLIANCE} >= 95)}" || { echo "FAIL: Compliance < 95%"; exit 1; }
            awk "BEGIN {exit !(${DURATION} <= 7200)}" || { echo "FAIL: Duration > 2h"; exit 1; }
            test "${FAILED}" -eq 0 || { echo "FAIL: Failed hosts detected"; exit 1; }
          '

      - name: Validate minimum concurrent patch fleet (>=5 hosts)
        run: make validate-patch-fleet

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "::error::CI workflow failed — inspect the failed step logs above."
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -sfS -X POST -H "Content-type: application/json" \
              --data "{\"text\":\"Patch CI failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL" || echo "Slack webhook post failed (non-fatal)"
          fi

      - name: Trigger rollback on patch failure
        if: failure() && steps.patch_run.outcome == 'failure'
        run: make rollback

      - name: Show report snippet
        run: |
          docker compose exec -T ansible sh -lc \
            'jq "{compliance_percentage, duration_seconds, hosts: [.hosts[] | {host, changed, failed}]}" /ansible/reports/patch_report_latest.json'

      - name: Tear down
        if: always()
        run: docker compose --profile sim down -v
