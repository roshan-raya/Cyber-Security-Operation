# Ansible Vault secrets — Catnip Games patch management platform
# Encrypt this file with: ansible-vault encrypt ansible/vault/secrets.yml
# Edit after encrypting: ansible-vault edit ansible/vault/secrets.yml
# Reference in playbooks: vars_files: - ../vault/secrets.yml

vault_grafana_admin_password: "PatchAdmin@2024!"
vault_grafana_admin_user: "admin"
vault_ansible_ssh_key_comment: "catnip-games-patch-management"

# Why vault_grafana_admin_password is here and not in .env:
# .env files are frequently committed by mistake despite .gitignore.
# Ansible Vault encrypted files are safe to commit — the ciphertext
# is useless without the vault password.
