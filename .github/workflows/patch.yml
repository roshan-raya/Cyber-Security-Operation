## Operational patch workflow for this project.
## Purpose: run the real patch path on main/schedule/manual trigger,
## then validate report/fleet gates, notify on failure, and rollback when patch execution fails.
## This complements ci.yml (PR/branch validation) by representing maintenance execution.
name: Patch Orchestration

on:
  # Auto-run after merge to main (operational readiness check).
  push:
    branches: [main]
  # Manual run from Actions tab during demo/maintenance windows.
  workflow_dispatch:
  # Daily scheduled patch orchestration (02:00 UTC).
  schedule:
    - cron: '0 2 * * *'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install make and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y make jq

      - name: Start stack
        run: |
          cp .env.example .env 2>/dev/null || true
          docker compose --profile sim up -d

      - name: Wait for services
        # Simple startup buffer; can be replaced later by a health-check loop.
        run: sleep 30

      - name: Run patch
        id: patch_run
        run: make patch

      - name: Validate fleet size and report gates
        # Enforces minimum target coverage + report KPI thresholds after patch run.
        id: validate_post_patch
        run: |
          make validate-patch-fleet
          make validate-reports

      - name: Show report
        run: make patch-report
        continue-on-error: true

      - name: Notify on failure
        # Sends run URL to Slack if webhook secret is configured.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "::error::Patch Orchestration workflow failed — open this run in the Actions tab for logs."
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -sfS -X POST -H "Content-type: application/json" \
              --data "{\"text\":\"Patch Orchestration failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL" || echo "Slack webhook post failed (non-fatal)"
          fi

      - name: Trigger rollback on patch failure
        # Rollback only if the patch step itself failed (not for lint/setup issues).
        if: failure() && steps.patch_run.outcome == 'failure'
        run: make rollback

      - name: Tear down
        if: always()
        run: docker compose --profile sim down -v
