name: CI — Code Quality & Integration

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install ansible-lint bandit yamllint

      - name: Python syntax check — all SOC scripts
        run: |
          echo "=== Checking TheHive scripts ==="
          python3 -m py_compile thehive/setup/init_thehive.py
          python3 -m py_compile thehive/setup/import_templates.py
          python3 -m py_compile thehive/setup/canonicalize_templates.py
          echo "=== Checking MISP scripts ==="
          python3 -m py_compile misp/setup/init_misp.py
          python3 -m py_compile misp/setup/configure_feeds.py
          python3 -m py_compile misp/setup/verify_misp.py
          python3 -m py_compile misp/setup/misp_thehive_integration.py
          python3 -m py_compile misp/setup/misp_http_session.py
          echo "=== Checking Cortex scripts ==="
          python3 -m py_compile cortex/setup/init_cortex.py
          python3 -m py_compile cortex/setup/configure_analysers.py
          python3 -m py_compile cortex/setup/verify_cortex.py
          python3 -m py_compile cortex/setup/connect_thehive.py
          echo "=== Checking automation scripts ==="
          python3 -m py_compile cortex/automation/alert_ingestor.py
          python3 -m py_compile cortex/automation/alert_enricher.py
          python3 -m py_compile cortex/automation/misp_exporter.py
          python3 -m py_compile cortex/automation/kpi_tracker.py
          python3 -m py_compile cortex/automation/kpi_metrics_server.py
          python3 -m py_compile cortex/automation/escalation_manager.py
          echo "=== Checking log generator ==="
          python3 -m py_compile log_generator/generator.py
          python3 -m py_compile log_generator/metrics_exporter.py
          python3 -m py_compile log_generator/thehive_alerter.py
          python3 -m py_compile log_generator/misp_ioc_exporter.py
          python3 -m py_compile log_generator/orchestrator.py
          echo "=== Checking SOC console ==="
          python3 -m py_compile soc_console/server.py
          python3 -m py_compile soc_console/campaigns.py
          echo "All Python scripts: syntax OK"

      - name: Bandit security scan
        run: |
          bandit -r thehive/ misp/ cortex/ log_generator/ soc_console/ \
            -ll --exclude "*/test*,*/__pycache__/*" \
            -f txt || true
          echo "Bandit scan complete (warnings above are informational)"

      - name: YAML validation
        run: |
          yamllint prometheus/prometheus.yml
          yamllint prometheus/alert.rules.yml
          yamllint ansible/ansible.cfg || true
          echo "YAML validation complete"

      - name: JSON validation
        run: |
          python3 -m json.tool thehive/config/case_templates.json > /dev/null
          python3 -m json.tool log_generator/config/log_profiles.json > /dev/null
          python3 -m json.tool grafana/provisioning/dashboards/soc-kpi.json > /dev/null
          echo "JSON validation complete"

      - name: Check secrets not committed
        run: |
          if git log --all --full-history -- "thehive/setup/api_key.txt" \
            | grep -q "commit"; then
            echo "FAIL: api_key.txt found in git history"
            exit 1
          fi
          if git log --all --full-history -- "cortex/setup/cortex_api_key.txt" \
            | grep -q "commit"; then
            echo "FAIL: cortex_api_key.txt found in git history"
            exit 1
          fi
          if [ -f ".env" ] && git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env file is tracked by git"
            exit 1
          fi
          echo "Secret check: PASS — no secrets in git"

      - name: Validate TheHive templates config
        run: |
          python3 -c "
          import json
          with open('thehive/config/case_templates.json') as f:
              templates = json.load(f)
          assert len(templates) == 4, f'Expected 4 templates got {len(templates)}'
          required = ['BOT_ATTACK','ACCOUNT_COMPROMISE',
                      'SOCIAL_ENGINEERING','DDOS_INFRASTRUCTURE']
          names = [t['name'] for t in templates]
          for r in required:
              assert r in names, f'Missing template: {r}'
          print(f'Templates config: {len(templates)}/4 valid')
          "

      - name: Validate docker-compose services
        run: |
          pip install pyyaml
          python3 -c "
          import yaml
          with open('docker-compose.yml') as f:
              compose = yaml.safe_load(f)
          services = compose.get('services', {})
          required = ['thehive','cassandra','misp','misp-db',
                      'misp-redis','cortex','cortex-db',
                      'prometheus','grafana','alertmanager']
          missing = [s for s in required if s not in services]
          if missing:
              print(f'FAIL: Missing services: {missing}')
              exit(1)
          print(f'docker-compose: all {len(required)} required services present')
          "

      - name: Check documentation
        run: |
          test -f docs/playbooks/playbook_bot_attack.md
          test -f docs/playbooks/playbook_account_compromise.md
          test -f docs/playbooks/playbook_social_engineering.md
          test -f docs/playbooks/playbook_ddos.md
          test -f docs/escalation/escalation_procedures.md
          test -f docs/runbook/operational_runbook.md
          echo "Documentation check: all 6 files present"

      - name: Ansible lint
        run: |
          ansible-lint ansible/ || true
          echo "Ansible lint complete"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make jq
          pip install requests pyyaml

      - name: Build Docker images
        run: |
          docker compose --profile sim build --no-cache

      - name: Start monitoring stack
        run: |
          cp .env.example .env
          docker compose up -d prometheus grafana alertmanager
          sleep 30

      - name: Validate Prometheus health
        run: |
          curl -sf http://localhost:9090/-/ready
          echo "Prometheus: ready"

      - name: Validate Grafana health
        run: |
          curl -sf http://localhost:3000/api/health
          echo "Grafana: healthy"

      - name: Start patch simulation stack
        run: |
          docker compose --profile sim up -d
          sleep 45

      - name: Ansible syntax check
        run: |
          docker compose exec -T ansible sh -lc \
            "ansible-playbook -i inventory/hosts.ini \
             playbooks/patch_orchestrator.yml --syntax-check"

      - name: Run patch orchestration
        run: make patch

      - name: Validate patch reports
        run: |
          docker compose exec -T ansible sh -lc '
            test -f /ansible/reports/patch_report_latest.json
            test -f /ansible/reports/patch_report_latest.csv
            test -f /ansible/reports/patch_metrics.prom
            COMPLIANCE=$(jq -r ".compliance_percentage" \
              /ansible/reports/patch_report_latest.json)
            echo "Compliance: $COMPLIANCE%"
            awk "BEGIN {exit !($COMPLIANCE >= 95)}" || \
              { echo "FAIL: Compliance < 95%"; exit 1; }
            echo "Patch validation: PASS"
          '

      - name: Alert ingestor dry run
        run: |
          python3 cortex/automation/alert_ingestor.py --dry-run
          echo "Alert ingestor dry run: PASS"

      - name: KPI tracker test
        run: |
          python3 cortex/automation/kpi_tracker.py \
            --output prometheus || true
          echo "KPI tracker: PASS"

      - name: Escalation manager dry run
        run: |
          python3 cortex/automation/escalation_manager.py \
            --dry-run || true
          echo "Escalation manager dry run: PASS"

      - name: Save patch report artifact
        if: always()
        run: |
          docker compose exec -T ansible sh -lc \
            "cat /ansible/reports/patch_report_latest.json" \
            > patch_report_ci.json 2>/dev/null || true

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report-${{ github.sha }}
          path: patch_report_ci.json
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose --profile sim down -v
