# Local “mini production” for patch + observability demos.
#
# Think of it as three rings that talk to each other:
#   1) Monitoring: prometheus, grafana, alertmanager (always-on stack; `docker compose up` without profile).
#   2) Simulation (--profile sim): ansible control node + fake SSH “patch targets” + node exporters.
#   3) Reports/metrics volume: ansible_reports — patch_orchestrator writes JSON/CSV/.prom here; metrics_exporter.py
#      in the ansible container reads those files and Prometheus scrapes :9101 (see prometheus/prometheus.yml).
#
# Common flows:
#   - `make up-sim` then `make patch` — exercises ansible/playbooks/patch_orchestrator.yml end-to-end.
#   - CI: .github/workflows/ci.yml builds this compose project and runs the same patch + report checks.
services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    user: nobody
    read_only: true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    # Data volume use: path and retention are explicit for restart safety and bounded disk usage
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      alertmanager:
        condition: service_healthy
      log-generator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    environment:
      - ALERTMANAGER_WEBHOOK_URL=${ALERTMANAGER_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s|__ALERTMANAGER_WEBHOOK_URL__|${ALERTMANAGER_WEBHOOK_URL}|g" /tmp/alertmanager.yml
        sed -i "s|__SLACK_WEBHOOK_URL__|${SLACK_WEBHOOK_URL}|g" /tmp/alertmanager.yml
        sed -i "s|__PAGERDUTY_ROUTING_KEY__|${PAGERDUTY_ROUTING_KEY}|g" /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    user: grafana
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-Nepsoft@123!}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_SERVER_HTTP_PORT=3000
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Synthetic varying metrics (log/event–like rates) for live-looking Grafana charts — demo only.
  # Service name: log-generator (image runs scripts/log_metrics_exporter.py on :9104). If you
  # expected a container named log_api, this is the same role in this stack.
  log-generator:
    image: python:3.12-slim-bookworm
    container_name: log-generator
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "/app/log_metrics_exporter.py"]
    volumes:
      - ./scripts/log_metrics_exporter.py:/app/log_metrics_exporter.py:ro
    expose:
      - "9104"
    networks:
      - monitoring
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/metrics', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # SOC KPI exporter based on real patch report data from ansible_reports volume.
  soc-kpi-exporter:
    image: python:3.12-slim-bookworm
    container_name: soc-kpi-exporter
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "/app/soc_kpi_exporter.py"]
    volumes:
      - ./scripts/soc_kpi_exporter.py:/app/soc_kpi_exporter.py:ro
      - ansible_reports:/ansible/reports:ro
    expose:
      - "9102"
    networks:
      - monitoring
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  node-exporter-1:
    image: prom/node-exporter:v1.8.0
    profiles:
      - sim
    container_name: node-exporter-1
    user: nobody
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter-2:
    image: prom/node-exporter:v1.8.0
    profiles:
      - sim
    container_name: node-exporter-2
    user: nobody
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - monitoring
    restart: unless-stopped

  # Ansible control node (patch orchestration; metrics on 9101)
  ansible:
    build:
      context: ./ansible
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: ansible
    profiles:
      - sim
    # Option 2: PID 1 stays alive for `docker compose exec`; metrics_exporter on :9101 for Prometheus.
    # (Same idea as `python3 … & exec tail -f /dev/null`, plus SSH key bootstrap from ansible/entrypoint.sh
    # because this override replaces the image ENTRYPOINT.)
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -e
          if [ ! -f /ansible/.ssh/id_rsa ]; then
            mkdir -p /ansible/.ssh
            ssh-keygen -t ed25519 -f /ansible/.ssh/id_rsa -N ""
          fi
          cp /ansible/.ssh/id_rsa.pub /ssh_pubkey/id_rsa.pub
          python3 /ansible/metrics_exporter.py &
          exec tail -f /dev/null
    volumes:
      - ./ansible/playbooks:/ansible/playbooks:ro
      - ./ansible/inventory:/ansible/inventory:ro
      - ./ansible/roles:/ansible/roles:ro
      - ./ansible/metrics_exporter.py:/ansible/metrics_exporter.py:ro
      - ansible_reports:/ansible/reports
      - ansible_ssh:/ansible/.ssh
      - ssh_pubkey:/ssh_pubkey
    networks:
      - monitoring
    expose:
      - "9101"
    depends_on:
      - patch-target-1
      - patch-target-2
      - patch-target-3
      - patch-target-4
      - patch-target-5

  # Patch target containers (simulated Linux servers with SSH)
  patch-target-1:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-1
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-2:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-2
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-3:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-3
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-4:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-4
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-5:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-5
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  ansible_ssh:
  ssh_pubkey:
  ansible_reports:
