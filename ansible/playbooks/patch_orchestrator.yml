---
# Patch orchestrator — one playbook, two plays, one story:
#   Play 1 (hosts: all): patch every inventory host (roles: common → health_check → patch → security_scan).
#   Play 2 (hosts: localhost): reporting role writes reports + Prometheus textfile metrics under /ansible/reports.
#
# Why two plays: strategy: free runs patches concurrently across hosts; reporting must run once after
# everyone finishes, with access to all hostvars — localhost is the right place for that aggregation.
#
# Related files to keep mentally linked:
#   - Roles: ansible/roles/patch, security_scan, reporting (metrics template ends up as patch_metrics.prom).
#   - Observability: docker-compose.yml (ansible service + volume), prometheus/prometheus.yml, grafana provisioning.
#   - CI gate: .github/workflows/ci.yml runs this playbook and checks compliance/duration in JSON output.
# ===============================
# Play 1: Patch All Targets
# ===============================
- name: Patch all hosts
  hosts: all
  strategy: free
  gather_facts: true

  vars:
    patch_group: "{{ patch_group | default('all') }}"

  roles:
    - common
    - health_check
    - patch
    - security_scan
  # Why security_scan runs after patch:
  # We scan AFTER patching to measure how many CVEs the patch eliminated.
  # Scanning before and after gives a diff — but for this implementation
  # we scan post-patch to verify the patched state meets our security SLO.


# ===============================
# Play 2: Reporting (Single Host)
# ===============================
- name: Generate patch reports
  hosts: localhost
  gather_facts: false

  roles:
    - reporting
