# Alert rules: Prometheus evaluates these against scraped metrics (see prometheus.yml scrape jobs).
# When a rule is “firing”, Prometheus sends it to Alertmanager (alertmanager/alertmanager.yml).
#
# Patch-related metrics (patch_*) are produced by the reporting role template
# ansible/roles/reporting/templates/patch_metrics.prom.j2 and served via ansible/metrics_exporter.py.
# If you change metric names or labels there, update these expr blocks and Grafana queries together.
groups:
  - name: example
    interval: 1m
    rules: []

  - name: patching
    interval: 1m
    rules:
      - alert: PatchComplianceBelow95
        expr: patch_compliance_percentage < 95
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Patch compliance below 95%"
          description: "Patch compliance is {{ $value }}% (target >= 95%)."

  - name: patch_alerts
    interval: 1m
    rules:
      - alert: PatchFailure
        expr: patch_host_success == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Patch run failed for host {{ $labels.host }}"

      - alert: PatchDurationTooHigh
        expr: patch_run_duration_seconds > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Patch run duration exceeded 120 seconds"

      - alert: PatchNotRunRecently
        expr: (time() - patch_last_run_timestamp) > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No patch run in the last 24 hours"

  - name: patch_alerts_critical
    interval: 1m
    rules:
      - alert: PatchFailureCritical
        expr: patch_host_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Patch run failed for host {{ $labels.host }} (critical)"

      - alert: PatchHostUnreachable
        expr: up{job="patch_metrics"} == 0 or absent(up{job="patch_metrics"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Patch metrics exporter unreachable"

      - alert: PatchComplianceLow
        expr: patch_compliance_percentage < 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Patch compliance below 80% (current: {{ $value }}%)"

  - name: security_scan_alerts
    interval: 1m
    rules:
      - alert: CriticalCVEsRemaining
        expr: patch_scan_critical_cves > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical CVEs remain on host {{ $labels.host }} after patching"
          description: >
            {{ $value }} critical CVE(s) detected on {{ $labels.host }}.
            Patching did not resolve all critical vulnerabilities.
            Review Trivy scan results immediately.

      - alert: HighCVEsAboveThreshold
        expr: patch_scan_high_cves > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CVE count above threshold on {{ $labels.host }}"
          description: >
            {{ $value }} high-severity CVE(s) detected on {{ $labels.host }}.
            Threshold is 5. Review and schedule remediation.
