# Alertmanager — receives firing alerts from Prometheus and routes notifications.
#
# Upstream:
#   - prometheus/prometheus.yml (alerting.alertmanagers)
#   - prometheus/alert.rules.yml (alert definitions)
#
# Routing logic (current):
#   - critical -> webhook-critical + slack-critical + pagerduty-critical
#   - warning  -> slack-warning
#   - fallback -> console
#
# Secret handling:
#   This tracked file stores placeholders (__...__). docker-compose renders a runtime
#   /tmp/alertmanager.yml from .env values at container start.

global:
  resolve_timeout: 5m

templates: []

route:
  # Default receiver for anything not matched by a child route
  receiver: 'console'
  group_by: ['alertname', 'severity', 'job']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

  routes:
    - receiver: 'webhook-critical'
      matchers:
        - severity="critical"
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h
      continue: true

    - receiver: 'slack-critical'
      matchers:
        - severity="critical"
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h
      continue: true

    - receiver: 'pagerduty-critical'
      matchers:
        - severity="critical"
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h
      continue: false

    - receiver: 'slack-warning'
      matchers:
        - severity="warning"
      group_wait: 30s
      repeat_interval: 4h
      continue: false

inhibit_rules:
  # When a critical alert fires for the same alertname + host, suppress the
  # corresponding warning alert to reduce noise during active incidents.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname']

receivers:
  - name: 'console'
    # Console receiver: no config needed.
    # Fired alerts appear in Docker logs:
    #   docker compose logs alertmanager --follow

  - name: 'webhook-critical'
    webhook_configs:
      - url: '__ALERTMANAGER_WEBHOOK_URL__'
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: true

  - name: 'slack-warning'
    slack_configs:
      - api_url: '__SLACK_WEBHOOK_URL__'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          *Severity:* {{ .CommonLabels.severity }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Job:* {{ .CommonLabels.job }}
          *Instance:* {{ .CommonLabels.instance }}

  - name: 'slack-critical'
    slack_configs:
      - api_url: '__SLACK_WEBHOOK_URL__'
        send_resolved: true
        title: '[{{ .Status | toUpper }}][CRITICAL] {{ .CommonLabels.alertname }}'
        text: >-
          *Severity:* {{ .CommonLabels.severity }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Job:* {{ .CommonLabels.job }}
          *Instance:* {{ .CommonLabels.instance }}

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key: '__PAGERDUTY_ROUTING_KEY__'
        send_resolved: true
        severity: 'critical'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          job: '{{ .CommonLabels.job }}'
          instance: '{{ .CommonLabels.instance }}'
 
 