name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Validate all scripts
        run: |
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./*/__pycache__/*" \
            | while read f; do
                python3 -m py_compile "$f" \
                  && echo "[OK] $f" \
                  || { echo "[FAIL] $f"; exit 1; }
              done
          echo "All scripts valid for release"

      - name: Validate all JSON
        run: |
          find . -name "*.json" \
            -not -path "./.git/*" \
            | while read f; do
                python3 -m json.tool "$f" > /dev/null \
                  && echo "[OK] $f" \
                  || { echo "[FAIL] $f"; exit 1; }
              done

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # Catnip Games SOC Platform — Release ${{ github.ref_name }}

          ## Platform Summary
          A production-quality SOC incident management prototype
          for Catnip Games International.

          ## Components
          | Component | Version | Port |
          |-----------|---------|------|
          | TheHive | 5.2 | 9000 |
          | MISP | 2.5.36 | 8080 |
          | Cortex | 3.1.7 | 9001 |
          | Prometheus | 2.52.0 | 9090 |
          | Grafana | 10.4.2 | 3000 |
          | SOC Console | custom | 9103 |
          | KPI Server | custom | 9102 |
          | Log Generator | custom | 9104 |

          ## Sprints Delivered
          - Sprint 1: TheHive deployment + case templates
          - Sprint 2: MISP + threat intelligence + playbooks
          - Sprint 3: Cortex + automation scripts
          - Sprint 4: Elasticsearch + Kibana (desktop)
          - Sprint 5: KPIs + escalation + dashboards
          - Sprint 6: Auto log generator
          - Sprint 7: SOC operations console

          ## NFRs Met
          - Alert triage tracking: ≤15 minutes SLA
          - Intelligence sharing: <5 minutes (actual: 1 second)
          - Patch compliance: ≥95%
          - 24/7 availability: Docker restart policies
          - KPI tracking: Prometheus + Grafana

          ## Quick Start
          docker compose up -d
          make thehive-init
          make start-logs
          make soc-console
          EOF
          echo "Release notes generated"

      - name: Create release artifact
        run: |
          mkdir -p release_artifacts
          cp -r docs/ release_artifacts/
          cp README.md release_artifacts/
          cp SECURITY.md release_artifacts/
          cp .env.example release_artifacts/
          cp thehive/config/case_templates.json release_artifacts/
          cp log_generator/config/log_profiles.json release_artifacts/
          tar -czf catnip-soc-platform-${{ github.ref_name }}.tar.gz \
            release_artifacts/
          echo "Release artifact created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Catnip Games SOC Platform ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            catnip-soc-platform-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
