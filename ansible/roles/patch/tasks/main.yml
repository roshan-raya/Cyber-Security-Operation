---
# Patch: gather facts, apt update/upgrade, reboot if required, validate
- name: Capture pre-patch package snapshot for rollback
  ansible.builtin.shell: >
    dpkg-query -W -f='${Package}=${Version}\n' 2>/dev/null | sort
  register: pre_patch_packages
  changed_when: false
  failed_when: false
  # Why: rollback.yml needs to know what was installed before we changed anything.
  # We capture this at the very start of the patch role so the data is always fresh.

- name: Store rollback package list from pre-patch snapshot
  ansible.builtin.set_fact:
    rollback_packages: >-
      {{ pre_patch_packages.stdout_lines
         | map('regex_replace', '=.*$', '')
         | list }}
  when: pre_patch_packages.stdout_lines is defined and
        pre_patch_packages.stdout_lines | length > 0
  # Why: strip version suffixes so apt can reinstall current-or-later versions.
  # Storing package names only (not pinned versions) avoids downgrade failures
  # when the target version is no longer in the apt cache.

- name: Run patch and validation
  block:
    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
      register: apt_update

    - name: FAILURE SIMULATION (optional) - force this host to fail
      ansible.builtin.fail:
        msg: "Simulated patch failure for demo (fail_host={{ fail_host }})"
      when: fail_host is defined and fail_host | length > 0 and inventory_hostname == fail_host

    - name: Upgrade packages (security and safe updates)
      ansible.builtin.apt:
        upgrade: safe
      register: upgrade_result

    - name: Set patch changed flag
      ansible.builtin.set_fact:
        patch_changed: "{{ upgrade_result.changed | default(false) }}"

    - name: Check if reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Patch orchestration reboot"
        connect_timeout: 5
        reboot_timeout: 120
      when: reboot_required.stat.exists | default(false) | bool
      register: reboot_result

    - name: Set patch rebooted flag
      ansible.builtin.set_fact:
        patch_rebooted: "{{ reboot_result is changed | default(false) }}"

    - name: Wait for connection after reboot
      ansible.builtin.wait_for_connection:
        timeout: 120
      when: reboot_required.stat.exists | default(false) | bool

    - name: Re-gather facts after reboot
      ansible.builtin.setup:
      when: reboot_required.stat.exists | default(false) | bool

    - name: Validate system health (uptime >= 0)
      ansible.builtin.assert:
        that: ansible_facts['uptime_seconds'] >= 0
        fail_msg: "Uptime check failed"
  rescue:
    - name: Mark patch failed
      ansible.builtin.set_fact:
        patch_failed: true

    - name: Run rollback (only if enabled)
      ansible.builtin.include_tasks: rollback.yml
      when: rollback_enabled | default(false) | bool
