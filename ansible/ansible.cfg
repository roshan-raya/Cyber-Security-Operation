# Ansible defaults for the control-node container (paths like /ansible/... match docker-compose.yml mounts).
# Inventory and playbooks live under ansible/; CI runs syntax-check with ANSIBLE_ROLES_PATH aligned to this.
# Pair with: ansible/playbooks/patch_orchestrator.yml, ansible/inventory/hosts.ini, .ansible-lint (CI policy).
[defaults]
# vault_password_file = ../.vault-password
# Uncomment this line after creating .vault-password at project root.
# In Docker sim: mount the file into the container or create /.vault-password
# inside the ansible container before enabling.
# See ansible/vault/README.md for full setup instructions.
roles_path = /ansible/roles
inventory = inventory/hosts.ini
private_key_file = /ansible/.ssh/id_rsa
host_key_checking = False
forks = 5
timeout = 30
retry_files_enabled = False
stdout_callback = default
log_path = /ansible/patch.log

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[privilege_escalation]
become = True
become_method = sudo
