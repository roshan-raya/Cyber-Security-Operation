# Prometheus: scrapes metrics, evaluates alert.rules.yml, forwards firing alerts to Alertmanager.
#
# How this file fits the patch story:
#   - Job "patch_metrics" scrapes ansible:9101 (metrics_exporter.py serving patch_metrics.prom).
#   - Job "node-exporter" feeds host/node dashboards.
#   - Alert definitions are in prometheus/alert.rules.yml.
#   - Notification routing (Slack/Webhook/PagerDuty) is handled in alertmanager/alertmanager.yml.
global:
  scrape_interval: 5m
  evaluation_interval: 5m
# For testing, temporarily override per-job: add scrape_interval: 15s (or 30s) under the desired job's scrape_configs entry.

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - node-exporter-1:9100
          - node-exporter-2:9100
        labels:
          datacenter: dc1
          role: game-node

  - job_name: patch_metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - ansible:9101
        labels:
          role: patch-orchestration

  - job_name: alertmanager
    scrape_interval: 15s
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          role: alertmanager

  - job_name: soc_kpi
    scrape_interval: 60s
    static_configs:
      - targets:
          - soc-kpi-exporter:9102
        labels:
          role: soc-kpi

  - job_name: log_generator
    scrape_interval: 15s
    static_configs:
      - targets:
          - log-generator:9104
        labels:
          role: log-generator
