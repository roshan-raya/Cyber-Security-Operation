name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"
  pull_request:
  workflow_dispatch:

jobs:
  sast:
    name: SAST — Python Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r thehive/ misp/ cortex/ log_generator/ soc_console/ \
            -ll \
            --exclude "*/test*,*/__pycache__/*" \
            -f json -o bandit_report.json || true
          bandit -r thehive/ misp/ cortex/ log_generator/ soc_console/ \
            -lll \
            --exclude "*/test*,*/__pycache__/*" \
            -f txt || true
          echo "SAST scan complete"

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report-${{ github.sha }}
          path: bandit_report.json
          retention-days: 30

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=0

          # Check for API keys patterns
          if grep -r "Bearer [a-zA-Z0-9+/]{20,}" \
            --include="*.py" --include="*.yml" \
            --exclude-dir=".git" . 2>/dev/null \
            | grep -v "api_key.txt" \
            | grep -v ".env"; then
            echo "WARNING: Possible hardcoded Bearer token found"
            FOUND=1
          fi

          # Check for password patterns
          if grep -rn "password.*=.*['\"][^'\"]{8,}['\"]" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude-dir="__pycache__" . 2>/dev/null \
            | grep -v "os.getenv\|os.environ\|default\|example\|test\|#"; then
            echo "WARNING: Possible hardcoded password found"
          fi

          # Check api key files not tracked
          if git ls-files thehive/setup/api_key.txt \
            cortex/setup/cortex_api_key.txt \
            .misp_auth_key 2>/dev/null | grep -q .; then
            echo "FAIL: Secret key files are tracked in git"
            exit 1
          fi

          echo "Secret scan: PASS"

  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov Docker Compose scan
        run: |
          checkov -f docker-compose.yml \
            --framework dockerfile \
            --quiet || true
          echo "Docker Compose IaC scan complete"

      - name: Check Docker security basics
        run: |
          pip install pyyaml
          python3 -c "
          import yaml
          with open('docker-compose.yml') as f:
              compose = yaml.safe_load(f)
          services = compose.get('services', {})
          issues = []
          for name, svc in services.items():
              if svc is None:
                  continue
              # Check for privileged mode
              if svc.get('privileged'):
                  issues.append(f'{name}: privileged mode enabled')
              # Check for host network
              if svc.get('network_mode') == 'host':
                  issues.append(f'{name}: host network mode')
          if issues:
              print('Security issues found:')
              for i in issues: print(f'  - {i}')
          else:
              print('Docker security check: PASS')
              print(f'Checked {len(services)} services')
          "

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb \
            generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy scan — Prometheus image
        run: |
          trivy image prom/prometheus:v2.52.0 \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --no-progress || true

      - name: Trivy scan — Grafana image
        run: |
          trivy image grafana/grafana:10.4.2 \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --no-progress || true

      - name: Trivy scan summary
        run: |
          echo "Container scan complete"
          echo "Review output above for HIGH/CRITICAL CVEs"
