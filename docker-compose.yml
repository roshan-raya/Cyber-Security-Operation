services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    user: nobody
    read_only: true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    # Data volume use: path and retention are explicit for restart safety and bounded disk usage
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    user: grafana
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-Nepsoft@123!}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_SERVER_HTTP_PORT=3000
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  node-exporter-1:
    image: prom/node-exporter:v1.8.0
    profiles:
      - sim
    container_name: node-exporter-1
    user: nobody
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter-2:
    image: prom/node-exporter:v1.8.0
    profiles:
      - sim
    container_name: node-exporter-2
    user: nobody
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - monitoring
    restart: unless-stopped

  # Ansible control node (patch orchestration; metrics on 9101)
  ansible:
    build:
      context: ./ansible
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: ansible
    profiles:
      - sim
    volumes:
      - ./ansible/playbooks:/ansible/playbooks:ro
      - ./ansible/inventory:/ansible/inventory:ro
      - ./ansible/roles:/ansible/roles:ro
      - ansible_reports:/ansible/reports
      - ansible_ssh:/ansible/.ssh
      - ssh_pubkey:/ssh_pubkey
    networks:
      - monitoring
    expose:
      - "9101"
    depends_on:
      - patch-target-1
      - patch-target-2
      - patch-target-3
      - patch-target-4
      - patch-target-5

  # Patch target containers (simulated Linux servers with SSH)
  patch-target-1:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-1
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-2:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-2
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-3:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-3
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-4:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-4
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  patch-target-5:
    build:
      context: ./ansible/target
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        NO_PROXY: ""
    container_name: patch-target-5
    profiles:
      - sim
    volumes:
      - ssh_pubkey:/ssh_pubkey:ro
    networks:
      - monitoring
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: thehive
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  thehive:
    image: strangebee/thehive:5.2
    container_name: thehive
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      JVM_OPTS: -Xms512m -Xmx1g
    volumes:
      - thehive_data:/opt/thp/thehive/data
    networks:
      - monitoring
    command:
      - --cql-hostnames
      - cassandra
      - --cql-cluster
      - thehive
      - --cql-keyspace
      - thehive
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  misp-db:
    image: mysql:8.0
    container_name: misp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MISP_MYSQL_ROOT_PASSWORD:-misproot}
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:-misppassword}
    volumes:
      - misp_mysql_data:/var/lib/mysql
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  misp-redis:
    image: redis:7-alpine
    container_name: misp-redis
    volumes:
      - misp_redis_data:/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:latest
    container_name: misp-modules
    depends_on:
      misp-redis:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: misp
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      BASE_URL: ${MISP_BASEURL:-http://localhost:8080}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@catnipgames.com}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:-Nepsoft@321!}
      ADMIN_ORG: ${MISP_ORG:-CatnipGamesSOC}
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:-misppassword}
      REDIS_HOST: misp-redis
      REDIS_PORT: "6379"
      ENABLE_REDIS_EMPTY_PASSWORD: "true"
      DISABLE_SSL_REDIRECT: "true"
      DISABLE_PRINTING_PLAINTEXT_CREDENTIALS: "false"
      MISP_MODULES_FQDN: http://misp-modules
    volumes:
      - misp_data:/var/www/MISP/app/files
      - misp_config:/var/www/MISP/app/Config
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/users/login"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  cortex-db:
    image: elasticsearch:7.17.9
    container_name: cortex-db
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=cortex
    volumes:
      - cortex_es_data:/usr/share/elasticsearch/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    depends_on:
      cortex-db:
        condition: service_healthy
    ports:
      - "9001:9001"
    environment:
      - job_directory=/tmp/cortex-jobs
    volumes:
      - cortex_data:/var/run/cortex
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring
    command:
      - --es-uri
      - http://cortex-db:9200
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  ansible_ssh:
  ssh_pubkey:
  ansible_reports:
  cassandra_data:
  thehive_data:
  misp_mysql_data:
  misp_redis_data:
  misp_data:
  misp_config:
  cortex_es_data:
  cortex_data:
