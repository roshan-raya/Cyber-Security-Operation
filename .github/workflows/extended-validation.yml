## Extended validation workflow (benchmark + chaos).
## Purpose: run deeper regression checks on performance and resilience beyond normal PR CI.
## Relationship to ci.yml:
## - ci.yml validates the main happy path quickly.
## - this workflow validates stress/failure scenarios and uploads evidence artifacts.

name: Extended validation

on:
  # Manual full regression (benchmark + chaos) from the Actions tab.
  # Inputs are intentionally omitted so scheduled and manual executions stay identical.
  workflow_dispatch: {}
  schedule:
    # Weekly run: Monday 03:15 UTC.
    # For daily execution use: "15 3 * * *".
    - cron: "15 3 * * 1"

concurrency:
  # Avoid overlapping extended-validation runs on the same ref.
  group: extended-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Applies to JavaScript actions for runtime compatibility guidance.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark-and-chaos:
    name: Benchmark and chaos tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Pin SHAs to keep action versions deterministic.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make jq python3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build sim images
        run: docker compose --profile sim build

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose --profile sim up -d
          sleep 45

      - name: Health sanity check
        # Quick baseline check before running longer benchmark/chaos stages.
        run: make validate

      - name: Run benchmark
        run: make benchmark

      - name: Run chaos tests
        env:
          # Reuse the same webhook secret as ci.yml / patch.yml for consistent notifications.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: make chaos-test

      - name: Upload evidence artifacts
        # Always upload evidence so failed runs still provide traceable outputs for analysis.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-validation-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            docs/evidence/performance-report.md
            docs/evidence/chaos/

      - name: Tear down
        if: always()
        run: docker compose --profile sim down -v
